{% set version = "0.13.0" %}

package:
  name: libcbor
  version: {{ version }}

source:
  url: https://github.com/PJK/libcbor/archive/v{{ version }}.tar.gz
  sha256: 95a7f0dd333fd1dce3e4f92691ca8be38227b27887599b21cd3c4f6d6a7abb10

build:
  number: 0
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage('libcbor', max_pin='x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - cmake
    - make

test:
  commands:
    - test -f "${PREFIX}/lib/libcbor${SHLIB_EXT}"

about:
  home: https://github.com/PJK/libcbor/
  license: MIT
  license_file: LICENSE.md
  summary: CBOR protocol implementation for C

extra:
  recipe-maintainers:
    - chrisburr
